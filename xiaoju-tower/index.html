<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f08a5d"><title>小橘爬塔</title><meta name="description" content="肌肉小橘顺着广州塔扭转的钢网格往上爬：挑路线、歇脚、扛阵风、绕鸽子，从午后爬到入夜，在 454 米看全城亮灯。"><link rel="stylesheet" href="src/style.css"></head>
<body><main id="game" aria-label="小橘爬塔，攀爬广州塔的小游戏">
<div id="world"></div>
<div id="gust-bar" aria-hidden="true"><div class="fill"></div><span class="label">起风了 · 按住抓紧</span><span class="arrow"></span></div>
<div id="flash" aria-hidden="true"></div>

<section id="hud" hidden>
  <div class="meter">
    <div class="height"><b id="h-now">0</b><span>米</span><small>/ 454</small></div>
    <div class="next" id="h-next">下一个歇脚台 · 110 米</div>
    <div class="light" id="h-light">塔灯</div>
    <div class="stamina" role="meter" aria-label="体力" aria-valuemin="0" aria-valuemax="100"><div class="fill" id="stamina-fill"></div><span>体力</span></div>
  </div>
  <div class="stats"><span>用时 <b id="s-time">0:00</b></span><span>掉落 <b id="s-falls">0</b></span></div>
</section>

<div id="hint" role="status" aria-live="polite" hidden></div>

<section id="pad" hidden aria-label="操作键">
  <button class="key brace" data-act="brace"><b>抓紧</b><kbd>空格</kbd></button>
  <div class="dpad">
    <button class="key up" data-act="up" aria-label="往上爬"><b>↑</b><kbd>W</kbd></button>
    <button class="key left" data-act="left" aria-label="换到左边的柱子"><b>←</b><kbd>A</kbd></button>
    <button class="key right" data-act="right" aria-label="换到右边的柱子"><b>→</b><kbd>D</kbd></button>
    <button class="key down" data-act="down" aria-label="往下"><b>↓</b><kbd>S</kbd></button>
  </div>
</section>

<section id="intro" class="panel">
  <div class="eyebrow">广州塔 · 454 米</div>
  <h1>小橘<br>爬塔。</h1>
  <ul class="rules">
    <li><b>↑</b> 按住往上爬，体力会掉。停在横梁上就能歇。</li>
    <li><b>← →</b> 在横梁上换一根柱子，绕开蹲着的鸽子。</li>
    <li><b>抓紧</b> 起风前按住，扛过去再松开。</li>
  </ul>
  <div class="start-row"><button id="start" class="primary">开始爬 <span>↑</span></button><button id="mode" class="mode" type="button"></button></div>
  <p class="credit">地图数据 © OpenStreetMap contributors · 我的AI小木屋</p>
</section>

<section id="ending" class="panel" hidden>
  <div class="eyebrow">登顶</div>
  <h1>454 米，<br>全城亮灯。</h1>
  <p class="result"><span>用时 <b id="e-time">0:00</b></span><span>掉落 <b id="e-falls">0</b> 次</span><span>被鸽子吓到 <b id="e-pigeons">0</b> 次</span></p>
  <button id="again" class="primary">再爬一次 <span>↺</span></button>
</section>
</main>
<script src="vendor/three.min.js"></script>
<script src="data/city.js"></script>
<script src="src/core.js"></script>
<script src="src/game.js"></script>
</body></html>
