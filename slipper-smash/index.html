<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<link rel="icon" href="data:,">
<title>凉拖拍蟑螂</title>
<meta name="description" content="广州雨夜小巷，抄起人字拖划屏拍蟑螂的小游戏。">
<style>
html,body{margin:0;height:100%;background:#0b0d12;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;cursor:crosshair}
noscript{color:#f3ead8;font:16px sans-serif;position:fixed;inset:0;display:grid;place-items:center}
[hidden]{display:none!important}
button{min-width:48px;min-height:48px;border:1px solid #ffb23e;border-radius:10px;background:#17151bea;color:#f3ead8;font:700 16px sans-serif;touch-action:manipulation}
#pause-btn{position:fixed;right:max(12px,env(safe-area-inset-right));top:calc(17vh + 8px)}
#pause-panel{position:fixed;inset:0;display:grid;place-items:center;background:#0b0d12cc;color:#f3ead8;font:18px sans-serif;text-align:center}
#pause-panel .card{padding:24px;max-width:calc(100vw - 48px)}
#pause-panel button{display:block;width:200px;max-width:100%;margin:12px auto}
</style>
</head>
<body>
<canvas id="stage" aria-label="凉拖拍蟑螂：按住并划过蟑螂把它拍扁，别碰奶茶"></canvas>
<button id="pause-btn" type="button" aria-label="暂停" hidden>暂停</button>
<div id="pause-panel" role="dialog" aria-modal="true" aria-label="已暂停" hidden><div class="card"><h2>歇一歇</h2><button id="resume" type="button">继续</button><button id="pause-mute" type="button">声音：开</button></div></div>
<noscript>这个小游戏需要打开 JavaScript 才能玩。</noscript>
<script src="src/core.js"></script>
<script src="src/game.js"></script>
</body>
</html>
