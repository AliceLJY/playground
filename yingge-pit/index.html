<title>打回乐池</title>
<meta name="description" content="英歌小戏台上，三个英歌纸偶合力把乐池里爬上来的白衣木偶打回去。可以两个人同一台手机一起打。">
<style>

canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
noscript{color:#f6ecd8;font:16px sans-serif;position:fixed;inset:0;display:grid;place-items:center}
</style>
</head>
<body>
<canvas id="stage" aria-label="打回乐池：白衣木偶从乐池往上爬，铁枝一亮就点那一道，让那一道的英歌纸偶出槌把它打回去"></canvas>
<noscript>这个小游戏需要打开 JavaScript 才能玩。</noscript>
<script src="src/core.js"></script>
<script src="src/game.js"></script>
