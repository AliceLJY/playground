<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e6d9c4">
<link rel="icon" href="data:,">
<title>撸猫撸了一手毛</title>
<meta name="description" content="一只橘猫侧身站在你面前。顺毛撸它眯眼打呼噜，逆毛撸毛炸起来它回头看你，撸过头轻咬一口；每撸一下手上粘几根毛，最后拍拍手抖掉。">
<style>
html,body{margin:0;height:100%;background:#e6d9c4;overflow:hidden;overscroll-behavior:none}
canvas{position:fixed;left:0;top:0;display:block}
#gl{pointer-events:none}
#fx{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;cursor:grab}
#fx:active{cursor:grabbing}
.ui{position:fixed;font:500 15px "PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",system-ui,sans-serif;color:#4a4036}
#poses{left:50%;transform:translateX(-50%);bottom:max(14px,calc(env(safe-area-inset-bottom) + 10px));display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(246,241,228,0.9);border:1px solid rgba(74,64,54,0.25)}
#poses button{min-height:40px;min-width:64px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:#4a4036;font:inherit;cursor:pointer;touch-action:manipulation}
#poses button[aria-pressed="true"]{background:#c96f2a;color:#fff6e6}
#hint{left:50%;transform:translateX(-50%);bottom:max(72px,calc(env(safe-area-inset-bottom) + 68px));padding:10px 18px;border-radius:999px;background:rgba(40,28,20,0.78);color:#fff6e6;white-space:nowrap;pointer-events:none}
.btn{top:max(8px,env(safe-area-inset-top));min-height:40px;padding:0 14px;border:1px solid rgba(74,64,54,0.35);border-radius:999px;background:rgba(246,241,228,0.85);color:#4a4036;font:inherit;cursor:pointer;touch-action:manipulation}
#sound{right:max(12px,env(safe-area-inset-right))}
#nogl{inset:0;display:grid;place-items:center;padding:24px;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="gl" aria-hidden="true"></canvas>
<canvas id="fx" tabindex="0" aria-label="一只橘猫侧身站着：沿着背从头往尾巴撸是顺毛，往回撸是逆毛；左上角的手粘了毛，点一下拍掉。键盘按空格或右方向键顺毛撸一下，左方向键逆毛撸一下，C 拍手"></canvas>
<button id="sound" class="ui btn" type="button" aria-pressed="true">声音 开</button>
<div id="hint" class="ui" hidden></div>
<div id="poses" class="ui" role="group" aria-label="猫的姿势"><button type="button" data-pose="stand" aria-pressed="false">站着</button><button type="button" data-pose="belly" aria-pressed="false">躺着</button><button type="button" data-pose="sleep" aria-pressed="false">睡着</button></div>
<div id="nogl" class="ui" hidden>这台设备的浏览器画不了猫毛（不支持 WebGL）。</div>
<noscript><div class="ui" style="inset:0;display:grid;place-items:center">撸猫需要打开 JavaScript。</div></noscript>
<script src="src/core.js"></script>
<script src="src/cat-data.js"></script>
<script src="src/game.js"></script>
</body>
</html>
