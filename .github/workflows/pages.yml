name: Build and publish playground
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Check aju game and navigation
        working-directory: aju-guangzhou-ride
        run: |
          node --check src/core.js
          node --check src/game.js
          node --test tests/*.test.cjs

      - name: Check Xiaoju Racing
        working-directory: xiaoju-racing
        run: |
          node --check src/race-core.js
          node --check src/race-cat.js
          node --check src/race-world.js
          node --check src/race-game.js
          node --test tests/*.test.cjs

      - name: Check Rooftop Splash
        working-directory: rooftop-splash
        run: |
          node --check src/arena.js
          node --check src/core.js
          node --check src/world.js
          node --check src/game.js
          node --test tests/*.test.cjs

      - name: Check Shadow Gong
        working-directory: shadow-gong
        run: |
          node --check src/stage.js
          node --check src/rig.js
          node --check src/core.js
          node --check src/audio.js
          node --check src/world.js
          node --check src/game.js
          node --test tests/*.test.cjs

      - name: Check and bundle Late-Night Grocery
        working-directory: diorama-walk
        run: |
          for f in src/*.js; do node --check "$f"; done
          node --test tests/*.test.cjs
          npm ci
          node tools/build.mjs

      - name: Assemble _site
        run: |
          mkdir -p _site/aju _site/shanhe _site/xiaoju-racing _site/rooftop-splash
          cp index.html _site/index.html

          # 阿橘：build.py 把源码内联成一个离线 HTML
          cd aju-guangzhou-ride
          python3 build.py
          cp '阿橘的广州慢游.html' ../_site/aju/index.html
          cp vendor/THREE-LICENSE.txt ../_site/aju/THREE-LICENSE.txt
          cd ..

          # 小橘飞车：独立竞速项目，离线单文件发布
          cd xiaoju-racing
          python3 build.py
          cp '小橘飞车.html' ../_site/xiaoju-racing/index.html
          cp vendor/THREE-LICENSE.txt ../_site/xiaoju-racing/THREE-LICENSE.txt
          cd ..

          # 山河卷：纯静态，原样搬（不带文档截图和本地启动脚本）
          cp shanhe-scroll/index.html _site/shanhe/index.html
          cp -R shanhe-scroll/data shanhe-scroll/panoramas shanhe-scroll/vendor _site/shanhe/

          # 天台水枪：独立规则与场景，单文件离线发布
          python3 rooftop-splash/build.py
          cp 'rooftop-splash/天台水枪大战.html' _site/rooftop-splash/index.html
          cp rooftop-splash/vendor/THREE-LICENSE.txt _site/rooftop-splash/THREE-LICENSE.txt

      - name: Assemble Shadow Gong
        run: |
          # 灯影守夜：独立弹反玩法，单文件离线发布
          mkdir -p _site/shadow-gong
          python3 shadow-gong/build.py
          cp 'shadow-gong/灯影守夜.html' _site/shadow-gong/index.html
          cp shadow-gong/vendor/THREE-LICENSE.txt _site/shadow-gong/THREE-LICENSE.txt

      - name: Assemble Late-Night Grocery
        run: |
          # 深夜杂货店：放大走进微缩模型的恐怖小游戏，上面已打成单文件（Three.js 许可在文件开头注释里）
          mkdir -p _site/diorama-walk
          cp diorama-walk/dist/index.html _site/diorama-walk/index.html

      - name: Check 3D exhibits
        run: node --check floorplan/share.js

      - name: Check and bundle Floor Plan Walk-in
        working-directory: floorplan-walk
        run: |
          for f in src/*.js data/house.js; do node --check "$f"; done
          node --test tests/*.test.cjs
          npm ci
          node tools/build.mjs

      - name: Assemble 3D exhibits
        run: |
          # 机械沙虫：源码与打包在作者的提示词素材库，这里只放打好的单文件，原样发布
          mkdir -p _site/sandworm _site/floorplan
          cp sandworm/sandworm.html _site/sandworm/index.html
          cp sandworm/THREE-LICENSE.txt _site/sandworm/THREE-LICENSE.txt
          # 户型图：出片工程里的手机页成品（页面、打包脚本、四张产物图），原样发布
          cp floorplan/index.html floorplan/share.js floorplan/THREE-LICENSE.txt _site/floorplan/
          cp -R floorplan/assets _site/floorplan/
          # 走进户型图：同一套房子摆满家具、能走进去；上一步已打成单文件
          mkdir -p _site/floorplan-walk
          cp floorplan-walk/dist/index.html _site/floorplan-walk/index.html

      - name: Show what will be published
        run: find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
