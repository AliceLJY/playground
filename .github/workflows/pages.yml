name: Build and publish playground
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - name: Check Xiguan House
        working-directory: xiguan-house
        run: |
          node --check src/model.js
          node --check src/view.js
          node --test tests/*.test.cjs

      - name: Check aju game and navigation
        working-directory: aju-guangzhou-ride
        run: |
          node --check src/core.js
          node --check src/game.js
          node --test tests/*.test.cjs

      - name: Check Xiaoju Racing
        working-directory: xiaoju-racing
        run: |
          node --check src/race-core.js
          node --check src/race-cat.js
          node --check src/race-world.js
          node --check src/race-game.js
          node --test tests/*.test.cjs

      - name: Check Rooftop Splash
        working-directory: rooftop-splash
        run: |
          node --check src/arena.js
          node --check src/core.js
          node --check src/world.js
          node --check src/game.js
          node --test tests/*.test.cjs

      - name: Check Shadow Gong
        working-directory: shadow-gong
        run: |
          node --check src/stage.js
          node --check src/rig.js
          node --check src/core.js
          node --check src/audio.js
          node --check src/world.js
          node --check src/game.js
          node --test tests/*.test.cjs

      - name: Check Slipper Smash
        working-directory: slipper-smash
        run: |
          node --check src/core.js
          node --check src/game.js
          node --test tests/*.test.cjs

      - name: Check Herb Match
        working-directory: herb-match
        run: |
          node --check src/core.js
          node --check src/herbs.js
          node --check src/game.js
          node --test tests/*.test.cjs

      - name: Check Which Pillar Are You
        working-directory: yueju-pillars
        run: |
          node --check src/core.js
          node --check src/game.js
          node --test tests/*.test.cjs

      - name: Check Dispatch Replay
        working-directory: dispatch-replay
        run: |
          node --check src/core.js
          node --check src/view.js
          for f in data/*.js; do node --check "$f"; done
          node --test tests/*.test.cjs

      - name: Check Agent Engine
        working-directory: agent-engine
        run: |
          node --check src/core.js
          node --check src/view.js
          node --test tests/*.test.cjs

      - name: Check Handwritten Board
        working-directory: handwritten-board
        run: |
          node --check src/pages.js
          node --check src/core.js
          node --check src/board.js
          node --test tests/*.test.cjs

      - name: Check Gear Repair
        working-directory: gear-repair
        run: |
          for f in src/gear-profile.js src/gear-mesh.js src/framing.js; do node --check "$f"; done
          node --input-type=module --check < src/main.js
          node --test tests/*.test.cjs

      - name: Check Back to the Pit
        working-directory: yingge-pit
        run: |
          node --check src/core.js
          node --check src/game.js
          node --test tests/*.test.cjs

      - name: Check and bundle Late-Night Grocery
        working-directory: diorama-walk
        run: |
          for f in src/*.js; do node --check "$f"; done
          node --test tests/*.test.cjs
          npm ci
          node tools/build.mjs

      - name: Assemble _site
        run: |
          mkdir -p _site/aju _site/shanhe _site/xiaoju-racing _site/rooftop-splash
          cp index.html _site/index.html

          # 阿橘：build.py 把源码内联成一个离线 HTML
          cd aju-guangzhou-ride
          python3 build.py
          cp '阿橘的广州慢游.html' ../_site/aju/index.html
          cp vendor/THREE-LICENSE.txt ../_site/aju/THREE-LICENSE.txt
          cd ..

          # 小橘飞车：独立竞速项目，离线单文件发布
          cd xiaoju-racing
          python3 build.py
          cp '小橘飞车.html' ../_site/xiaoju-racing/index.html
          cp vendor/THREE-LICENSE.txt ../_site/xiaoju-racing/THREE-LICENSE.txt
          cd ..

          # 山河卷：纯静态，原样搬（不带文档截图和本地启动脚本）
          cp shanhe-scroll/index.html _site/shanhe/index.html
          cp -R shanhe-scroll/data shanhe-scroll/panoramas shanhe-scroll/vendor _site/shanhe/

          # 天台水枪：独立规则与场景，单文件离线发布
          python3 rooftop-splash/build.py
          cp 'rooftop-splash/天台水枪大战.html' _site/rooftop-splash/index.html
          cp rooftop-splash/vendor/THREE-LICENSE.txt _site/rooftop-splash/THREE-LICENSE.txt

      - name: Check, bundle and assemble Qilou Brawl
        working-directory: qilou-brawl
        run: |
          # 骑楼擂台：PINOC 泼溅角色 + PlayCanvas，不是单文件（引擎按相对路径找 worker，角色与动作是二进制素材）
          for f in src/*.js; do node --check "$f"; done
          node --test tests/*.test.cjs
          # playcanvas 带一个用不上的原生 canvas 包，跳过安装脚本免得在 CI 上编译；esbuild 单独补跑
          npm ci --ignore-scripts
          npm rebuild esbuild
          node tools/build.mjs
          mkdir -p ../_site/qilou-brawl
          cp -R dist/. ../_site/qilou-brawl/

      - name: Check, bundle and assemble Drizzle at Jianmen
        working-directory: jianmen-drizzle
        run: |
          # 细雨剑门：PINOC/JST-2 从高剑父 1926《山水》生成的泼溅场景 + PlayCanvas，不是单文件（场景是 SOG 二进制）
          for f in src/*.js; do node --check "$f"; done
          node --test tests/*.test.cjs
          # 同骑楼擂台：跳过 playcanvas 带的原生 canvas 包，esbuild 单独补跑
          npm ci --ignore-scripts
          npm rebuild esbuild
          node tools/build.mjs
          mkdir -p ../_site/jianmen-drizzle
          cp -R dist/. ../_site/jianmen-drizzle/

      - name: Assemble Shadow Gong
        run: |
          # 灯影守夜：独立弹反玩法，单文件离线发布
          mkdir -p _site/shadow-gong
          python3 shadow-gong/build.py
          cp 'shadow-gong/灯影守夜.html' _site/shadow-gong/index.html
          cp shadow-gong/vendor/THREE-LICENSE.txt _site/shadow-gong/THREE-LICENSE.txt

      - name: Assemble Slipper Smash
        run: |
          # 凉拖拍蟑螂：二维画布的划屏小游戏，没有构建步骤，页面、源码和图片原样发布
          mkdir -p _site/slipper-smash
          cp slipper-smash/index.html _site/slipper-smash/index.html
          cp -R slipper-smash/src slipper-smash/assets _site/slipper-smash/

      - name: Assemble Herb Match
        run: |
          # 药性配对：二维画布认药性小游戏，没有构建步骤，页面和源码原样发布
          mkdir -p _site/herb-match
          cp herb-match/index.html _site/herb-match/index.html
          cp -R herb-match/src _site/herb-match/

      - name: Assemble Which Pillar Are You
        run: |
          # 粤剧六柱测试：八道题测你是六柱里的哪一柱，没有构建步骤，页面、源码和插画原样发布
          mkdir -p _site/yueju-pillars
          cp yueju-pillars/index.html _site/yueju-pillars/index.html
          cp -R yueju-pillars/src yueju-pillars/img _site/yueju-pillars/

      - name: Assemble Back to the Pit
        run: |
          # 打回乐池：二维画布的英歌小游戏，没有构建步骤，页面、源码和图片原样发布
          mkdir -p _site/yingge-pit
          cp yingge-pit/index.html _site/yingge-pit/index.html
          cp -R yingge-pit/src yingge-pit/assets _site/yingge-pit/

      - name: Assemble Dispatch Replay
        run: |
          # 派活回放：一次真实 Claude Code 会话的回放动画，二维画布，没有构建步骤，页面、源码和数据原样发布
          mkdir -p _site/dispatch-replay
          cp dispatch-replay/index.html _site/dispatch-replay/index.html
          cp -R dispatch-replay/src dispatch-replay/data _site/dispatch-replay/

      - name: Assemble Agent Engine, Handwritten Board and Gear Repair
        run: |
          # agent 引擎是什么：六镜头讲解页，循环是真跑的教学小实现，没有构建步骤，页面和源码原样发布
          mkdir -p _site/agent-engine
          cp agent-engine/index.html _site/agent-engine/index.html
          cp -R agent-engine/src _site/agent-engine/
          # 手写板书：DOM 文字加 SVG 的板书播放器，字体子集与 GSAP 在 vendor/，原样发布
          mkdir -p _site/handwritten-board
          cp handwritten-board/index.html handwritten-board/THIRD_PARTY_NOTICES.md _site/handwritten-board/
          cp -R handwritten-board/src handwritten-board/vendor _site/handwritten-board/
          # 齿轮返修：dsh 原版与它自己返修后的齿轮对照，Three.js 在 vendor/，原样发布
          mkdir -p _site/gear-repair
          cp gear-repair/index.html gear-repair/THIRD_PARTY_NOTICES.md _site/gear-repair/
          cp -R gear-repair/src gear-repair/vendor _site/gear-repair/

      - name: Assemble Late-Night Grocery
        run: |
          # 深夜杂货店：放大走进微缩模型的恐怖小游戏，上面已打成单文件（Three.js 许可在文件开头注释里）
          mkdir -p _site/diorama-walk
          cp diorama-walk/dist/index.html _site/diorama-walk/index.html

      - name: Check 3D exhibits
        run: node --check floorplan/share.js

      - name: Check and bundle Floor Plan Walk-in
        working-directory: floorplan-walk
        run: |
          for f in src/*.js data/house.js; do node --check "$f"; done
          node --test tests/*.test.cjs
          npm ci
          node tools/build.mjs

      - name: Check and bundle Lens Lab
        working-directory: lens-lab
        run: |
          for f in src/*.js; do node --check "$f"; done
          node --test tests/*.test.cjs
          npm ci
          node tools/build.mjs

      - name: Check and bundle Cabin Above the Snowline
        working-directory: snowline-cabin
        run: |
          for f in src/*.js; do node --check "$f"; done
          node --test tests/*.test.cjs
          npm ci
          node tools/build.mjs

      - name: Assemble 3D exhibits
        run: |
          # 机械沙虫：源码与打包在作者的提示词素材库，这里只放打好的单文件，原样发布
          mkdir -p _site/sandworm _site/floorplan
          cp sandworm/sandworm.html _site/sandworm/index.html
          cp sandworm/THREE-LICENSE.txt _site/sandworm/THREE-LICENSE.txt
          # 户型图：出片工程里的手机页成品（页面、打包脚本、四张产物图），原样发布
          cp floorplan/index.html floorplan/share.js floorplan/THREE-LICENSE.txt _site/floorplan/
          cp -R floorplan/assets _site/floorplan/
          # 走进户型图：同一套房子摆满家具、能走进去；上一步已打成单文件
          mkdir -p _site/floorplan-walk
          cp floorplan-walk/dist/index.html _site/floorplan-walk/index.html
          # 雪线小木屋：纯代码搭的雪夜山间木屋；上面已打成单文件（Three.js 许可在文件开头注释里）
          mkdir -p _site/snowline-cabin
          cp snowline-cabin/dist/index.html _site/snowline-cabin/index.html
          # 凸透镜成像：光具座课件；上面已打成单文件（Three.js 许可在文件开头注释里）
          mkdir -p _site/lens-lab
          cp lens-lab/dist/index.html _site/lens-lab/index.html

      - name: Assemble Clockwork
        run: |
          # 机械钟齿轮：Gemini 4 Argon 一次生成的页面，Three.js 改读本地 vendor/，纯静态原样发布
          mkdir -p _site/clockwork
          cp clockwork/index.html clockwork/source.jpg clockwork/THREE-LICENSE.txt _site/clockwork/
          cp -R clockwork/vendor _site/clockwork/

      - name: Assemble Nanchan Temple
        run: |
          # 南禅寺大殿：Anatomy 生成的单文件页面（构建要本机的 Anatomy skill，这里只发布产物）
          mkdir -p _site/nanchan-temple
          cp nanchan-temple/index.html nanchan-temple/ANATOMY-LICENSE.txt _site/nanchan-temple/

      - name: Assemble Xiguan House
        run: |
          mkdir -p _site/xiguan-house/src
          cp xiguan-house/index.html _site/xiguan-house/
          cp xiguan-house/src/model.js xiguan-house/src/view.js _site/xiguan-house/src/

      - name: Show what will be published
        run: find _site -type f | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
