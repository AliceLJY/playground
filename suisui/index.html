<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16100c">
<link rel="icon" href="data:,">
<title>碎碎平安</title>
<meta name="description" content="解压小玩意：博古架上的瓶瓶罐罐和烦心事，点一下砸碎，按住蓄力炸开，划一下甩飞。">
<style>
:root{--ink:#f3e6d0;--ink2:#bba58a;--gold:#e8b65a;--red:#e2553f;--hand:"Kaiti SC","STKaiti","KaiTi","BiauKai","Songti SC","Noto Serif SC","Source Han Serif SC",serif;--sans:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#16100c}
body{color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  background:radial-gradient(120% 75% at 50% 28%,#3a2618 0%,#24170f 45%,#16100c 80%)}
[hidden]{display:none!important}
#app{position:fixed;left:0;top:0;width:100%;height:var(--vh,100%);display:flex;flex-direction:column;align-items:center}
header{height:60px;flex:none;width:var(--shelf-w,92vw);display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:8px;box-sizing:border-box}
.title{display:flex;align-items:baseline;gap:10px;min-width:0}
h1{margin:0;font:700 26px/1 var(--hand);letter-spacing:.06em;color:var(--ink);white-space:nowrap}
.seal{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:4px;background:#b8352a;color:#fbe9d6;font:700 14px/1 var(--hand);transform:translateY(-3px) rotate(-4deg);box-shadow:inset 0 0 0 1.5px rgba(251,233,214,.55)}
.hint{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .6s}
.hint.gone{opacity:0}
.count{flex:none;text-align:right;font-size:12.5px;color:var(--ink2);line-height:1.1}
.count b{display:block;font:700 24px/1 var(--sans);color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:.02em}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%}
#stage{will-change:transform}
.shelf{display:grid;padding:10px;border-radius:6px;position:relative;touch-action:none;
  background:repeating-linear-gradient(97deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px),repeating-linear-gradient(90deg,rgba(0,0,0,.06) 0 1px,transparent 1px 23px),linear-gradient(180deg,#6d4428,#55341e 60%,#4a2d19);
  box-shadow:0 24px 60px rgba(0,0,0,.6),0 4px 0 #2b190e,inset 0 1px 0 #a87346,inset 0 -2px 0 #2b190e}
.slot{position:relative;box-sizing:border-box;border:4px solid;border-color:#3a2214 #714829 #8d5c36 #462a17;outline:none;cursor:pointer;
  background:linear-gradient(180deg,#1a110a 0%,#22160d 62%,#2e1d11 100%);
  box-shadow:inset 0 12px 18px rgba(0,0,0,.65),inset 8px 0 12px rgba(0,0,0,.3),inset -4px 0 8px rgba(0,0,0,.25)}
.slot::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:linear-gradient(180deg,#7a4e2d,#5a381f);box-shadow:0 -1px 0 rgba(255,214,160,.18)}
.slot:focus-visible{box-shadow:inset 0 0 0 2px var(--gold),inset 0 12px 18px rgba(0,0,0,.65)}
.slot .shade{position:absolute;left:50%;bottom:6px;height:12px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),rgba(0,0,0,0));z-index:1;transition:opacity .3s}
.slot .lamp{position:absolute;inset:0;background:radial-gradient(70% 55% at 35% 30%,rgba(255,214,150,.07),transparent 70%);pointer-events:none}
.slot canvas{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);z-index:2;display:block;transition:opacity .2s,transform .12s}
.slot.empty .shade{opacity:0}
.slot .charge{position:absolute;left:12%;right:12%;top:9px;height:5px;border-radius:3px;background:rgba(0,0,0,.45);z-index:3;opacity:0;transition:opacity .15s}
.slot .charge i{position:absolute;inset:0;border-radius:3px;transform-origin:left center;transform:scaleX(var(--c,0));background:linear-gradient(90deg,#f6d48a,#ff9a3c 60%,#e2553f)}
.slot.charging .charge{opacity:1}
.slot.charging{box-shadow:inset 0 0 calc(34px * var(--c,0)) rgba(255,140,60,calc(.7 * var(--c,0))),inset 0 12px 18px rgba(0,0,0,.65)}
@media (hover:hover){.slot:not(.empty):hover canvas{transform:translateX(-50%) translateY(-2px) scale(1.04)}}
footer{height:84px;flex:none;display:flex;align-items:center;justify-content:center;gap:12px;padding-bottom:env(safe-area-inset-bottom)}
button{font:600 16px var(--sans);min-height:46px;border-radius:23px;padding:0 20px;cursor:pointer;touch-action:manipulation;color:var(--ink)}
.ghost{background:transparent;border:1.5px solid rgba(243,230,208,.38)}
.ghost:active{background:rgba(243,230,208,.08)}
.primary{background:var(--gold);border:0;color:#2a1608;font-weight:700;box-shadow:0 3px 0 #8a6224}
.primary:active{transform:translateY(2px);box-shadow:0 1px 0 #8a6224}
.primary:disabled{opacity:.5}
.icon{width:46px;padding:0;display:grid;place-items:center;background:transparent;border:1.5px solid rgba(243,230,208,.38)}
.icon svg{width:22px;height:22px}
.float{position:fixed;z-index:40;pointer-events:none;white-space:nowrap;font:700 var(--fs,26px)/1 var(--hand);color:#ffe2a0;letter-spacing:.06em;
  text-shadow:0 0 2px #a8281d,0 0 2px #a8281d,0 0 3px #a8281d,0 3px 0 #5e160f,0 0 22px rgba(255,160,70,.55);transform:translate(-50%,-50%);animation:rise var(--dur,1.15s) cubic-bezier(.2,.8,.3,1) forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.55)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.12)}28%{transform:translate(-50%,-85%) scale(1)}62%{opacity:1}100%{opacity:0;transform:translate(-50%,-180%) scale(1)}}
.dust-overlay{position:fixed;left:0;top:0;pointer-events:none;z-index:30}
dialog{background:#241810;color:var(--ink);border:1px solid #6b4428;border-radius:14px;padding:20px;width:min(86vw,340px);box-shadow:0 20px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(10,6,4,.6)}
dialog h2{margin:0 0 4px;font:700 20px var(--hand)}
dialog p{margin:0 0 14px;font-size:13px;color:var(--ink2)}
dialog input{box-sizing:border-box;width:100%;font:700 24px var(--hand);padding:14px 14px;border:0;border-radius:4px;background:linear-gradient(180deg,#fbe27a,#f2cd4b);color:#3a2914;outline:none;box-shadow:0 2px 0 #c99a22;-webkit-user-select:text;user-select:text}
dialog input::placeholder{color:rgba(58,41,20,.4)}
dialog .row{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
noscript{position:fixed;inset:0;display:grid;place-items:center;font-size:16px}
@media (prefers-reduced-motion:reduce){.float{animation:none;opacity:0}}
@media (max-width:420px){h1{font-size:23px}.hint{font-size:11.5px}button{padding:0 16px;font-size:15px}footer{gap:10px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">
      <h1>碎碎平安</h1><span class="seal" aria-hidden="true">砸</span>
      <span class="hint" id="hint">点一下砸碎 · 按住蓄力 · 划一下甩飞</span>
    </div>
    <div class="count">已砸<b id="count">0</b></div>
  </header>
  <main><div id="stage"><div class="shelf" id="shelf" role="group" aria-label="博古架，点一件东西把它砸碎"></div></div></main>
  <footer>
    <button class="ghost" id="write" type="button">写烦心事</button>
    <button class="primary" id="all" type="button">全砸了</button>
    <button class="icon" id="mute" type="button" aria-label="关掉声音" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="cross" d="M16 9.5l5 5M21 9.5l-5 5" hidden/></svg>
    </button>
  </footer>
</div>
<dialog id="dlg">
  <form method="dialog" id="noteForm">
    <h2>写下烦心事</h2>
    <p>最多十个字，贴上架子，然后砸了它。</p>
    <input id="noteText" name="t" maxlength="20" autocomplete="off" enterkeyhint="done" placeholder="比如：又要开会">
    <div class="row"><button class="ghost" value="cancel" type="button" id="noteCancel">算了</button><button class="primary" value="ok" type="submit">贴上去</button></div>
  </form>
</dialog>
<noscript>这个小玩意需要打开 JavaScript 才能玩。</noscript>
<script src="src/core.js"></script>
<script type="module" src="src/game.js"></script>
</body>
</html>
