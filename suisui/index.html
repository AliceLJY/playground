<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16100c">
<link rel="icon" href="data:,">
<title>碎碎平安</title>
<meta name="description" content="解压小玩意：博古架上的瓶瓶罐罐和烦心事，点一下砸碎，按住蓄力炸开，划一下甩飞。">
<style>
:root{--ink:#f3e6d0;--ink2:#bba58a;--gold:#e8b65a;--red:#e2553f;--hand:"Kaiti SC","STKaiti","KaiTi","BiauKai","Songti SC","Noto Serif SC","Source Han Serif SC",serif;--sans:-apple-system,"PingFang SC","Hiragino Sans GB","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#16100c}
body{color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;
  background:radial-gradient(120% 75% at 50% 22%,#2e2018 0%,#1a120d 48%,#0c0806 86%)}
[hidden]{display:none!important}
#app{position:fixed;left:0;top:0;width:100%;height:var(--vh,100%);display:flex;flex-direction:column;align-items:center}
header{height:60px;flex:none;width:var(--shelf-w,92vw);display:flex;align-items:flex-end;justify-content:space-between;padding-bottom:8px;box-sizing:border-box}
.title{display:flex;align-items:baseline;gap:10px;min-width:0}
h1{margin:0;font:700 26px/1 var(--hand);letter-spacing:.06em;color:var(--ink);white-space:nowrap}
.seal{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:4px;background:#b8352a;color:#fbe9d6;font:700 14px/1 var(--hand);transform:translateY(-3px) rotate(-4deg);box-shadow:inset 0 0 0 1.5px rgba(251,233,214,.55)}
.hint{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .6s}
.hint.gone{opacity:0}
.count{flex:none;text-align:right;font-size:12.5px;color:var(--ink2);line-height:1.1}
.count b{display:block;font:700 24px/1 var(--sans);color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:.02em}
main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;width:100%}
#stage{will-change:transform}
.shelf{display:grid;padding:10px;border-radius:4px;position:relative;touch-action:none;
  background:repeating-linear-gradient(93deg,rgba(255,210,170,.025) 0 1px,transparent 1px 7px),repeating-linear-gradient(88deg,rgba(0,0,0,.10) 0 2px,transparent 2px 19px),linear-gradient(180deg,#43231a,#30180f 55%,#26130c);
  box-shadow:0 30px 70px rgba(0,0,0,.7),0 3px 0 #120805,inset 0 1px 0 rgba(224,170,110,.35),inset 0 0 0 1px rgba(200,150,80,.18),inset 0 -2px 0 #120805}
.slot{position:relative;box-sizing:border-box;border:4px solid;border-color:#1c0d08 #4a271b #5c3223 #26120b;outline:none;cursor:pointer;overflow:hidden;
  background:radial-gradient(90% 75% at 50% 0%,#2a1c17 0%,#170f0c 58%,#0e0806 100%);
  box-shadow:inset 0 14px 20px rgba(0,0,0,.7),inset 8px 0 14px rgba(0,0,0,.35),inset -6px 0 10px rgba(0,0,0,.3)}
.slot::after{content:"";position:absolute;left:0;right:0;bottom:0;height:9px;background:linear-gradient(180deg,#5a3424,#33190f);box-shadow:0 -1px 0 rgba(255,205,150,.28)}
.slot:focus-visible{box-shadow:inset 0 0 0 2px var(--gold),inset 0 12px 18px rgba(0,0,0,.65)}
.slot .shade{position:absolute;left:50%;bottom:6px;height:12px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.6),rgba(0,0,0,0));z-index:1;transition:opacity .3s}
.slot .lamp{position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(48% 100% at 50% -6%,rgba(255,226,178,.20),rgba(255,214,160,.06) 55%,transparent 76%),radial-gradient(42% 10% at 50% calc(100% - 11px),rgba(255,212,150,.32),transparent 72%)}
.slot .lamp::before{content:"";position:absolute;left:41%;right:41%;top:0;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,#8a6a3a,#e8cf98,#8a6a3a);box-shadow:0 2px 10px 2px rgba(255,220,160,.45)}
.slot canvas{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);z-index:2;display:block;transition:opacity .2s,transform .12s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.55))}
.slot.empty .shade{opacity:0}
.slot .charge{position:absolute;left:12%;right:12%;top:9px;height:5px;border-radius:3px;background:rgba(0,0,0,.45);z-index:3;opacity:0;transition:opacity .15s}
.slot .charge i{position:absolute;inset:0;border-radius:3px;transform-origin:left center;transform:scaleX(var(--c,0));background:linear-gradient(90deg,#f6d48a,#ff9a3c 60%,#e2553f)}
.slot.charging .charge{opacity:1}
.slot.charging{box-shadow:inset 0 0 calc(34px * var(--c,0)) rgba(255,140,60,calc(.7 * var(--c,0))),inset 0 12px 18px rgba(0,0,0,.65)}
@media (hover:hover){.slot:not(.empty):hover canvas{transform:translateX(-50%) translateY(-2px) scale(1.04)}}
footer{height:84px;flex:none;display:flex;align-items:center;justify-content:center;gap:12px;padding-bottom:env(safe-area-inset-bottom)}
button{font:600 16px var(--sans);min-height:46px;border-radius:23px;padding:0 20px;cursor:pointer;touch-action:manipulation;color:var(--ink)}
.ghost{background:transparent;border:1.5px solid rgba(243,230,208,.38)}
.ghost:active{background:rgba(243,230,208,.08)}
.primary{background:var(--gold);border:0;color:#2a1608;font-weight:700;box-shadow:0 3px 0 #8a6224}
.primary:active{transform:translateY(2px);box-shadow:0 1px 0 #8a6224}
.primary:disabled{opacity:.5}
.icon{width:46px;padding:0;display:grid;place-items:center;background:transparent;border:1.5px solid rgba(243,230,208,.38)}
.icon svg{width:22px;height:22px}
.float{position:fixed;z-index:40;pointer-events:none;white-space:nowrap;font:700 var(--fs,26px)/1 var(--hand);color:#ffe2a0;letter-spacing:.06em;
  text-shadow:0 0 2px #a8281d,0 0 2px #a8281d,0 0 3px #a8281d,0 3px 0 #5e160f,0 0 22px rgba(255,160,70,.55);transform:translate(-50%,-50%);animation:rise var(--dur,1.15s) cubic-bezier(.2,.8,.3,1) forwards}
@keyframes rise{0%{opacity:0;transform:translate(-50%,-30%) scale(.55)}15%{opacity:1;transform:translate(-50%,-70%) scale(1.12)}28%{transform:translate(-50%,-85%) scale(1)}62%{opacity:1}100%{opacity:0;transform:translate(-50%,-180%) scale(1)}}
.dust-overlay{position:fixed;left:0;top:0;pointer-events:none;z-index:30}
/* the shared room */
.roomline{margin:0;height:24px;line-height:24px;overflow:hidden;font-size:12.5px;color:var(--ink2);width:var(--shelf-w,92vw);box-sizing:border-box;white-space:nowrap;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.roomline.down,.roomline.full{color:#e8a27a}
.roomline.connecting{color:var(--ink2)}
.roomline b{font-weight:600;color:var(--ink)}
.roomline .who{display:inline-flex;align-items:center;gap:4px;padding:0 7px;height:20px;border-radius:10px;background:rgba(243,230,208,.08);color:var(--ink);font-size:12px;flex:none}
.roomline .who i{width:8px;height:8px;border-radius:50%}
.roomline .who.me{background:rgba(232,182,90,.22)}
.waitbar{display:none;height:34px;width:var(--shelf-w,92vw);box-sizing:border-box;align-items:center;gap:6px;font-size:12px;color:var(--ink2);overflow:hidden;white-space:nowrap;flex:none}
body.room .waitbar{display:flex}
.waitbar b{font-weight:600;color:var(--ink);margin-right:4px}
.waitbar .slip{display:inline-grid;place-items:center;width:22px;height:26px;border-radius:2px;background:linear-gradient(160deg,#c63022,#7a150e);box-shadow:0 1px 0 rgba(0,0,0,.4);font-size:9px;color:#fbe9d6;flex:none}
.waitbar .slip.mine{width:34px;background:linear-gradient(160deg,#f2cf7a,#c99a3a);color:#2a1608;font-weight:700;outline:2px solid rgba(232,182,90,.5);outline-offset:1px}
.waitbar .tip{margin-left:6px;overflow:hidden;text-overflow:ellipsis}
.slot .owner{position:absolute;left:50%;bottom:1px;transform:translateX(-50%);z-index:4;font-size:10.5px;line-height:15px;padding:0 6px;border-radius:8px;white-space:nowrap;pointer-events:none;display:none}
.slot .owner.on{display:block}
.slot .owner.me{background:var(--gold);color:#2a1608;font-weight:700}
.slot .owner.other{background:var(--who,#ccc);color:#1a0f0a;font-weight:600}
.slot .owner.shared{background:rgba(243,230,208,.16);color:var(--ink)}
.slot.empty .owner{display:none}
#stage{position:relative}
.slot .tag{position:absolute;left:6px;right:6px;top:18px;z-index:4;text-align:center;font-size:11.5px;line-height:18px;color:#f3e6d0;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .tag.on{opacity:1}
.slot .tag.me{color:#2a1608;background:var(--gold);border-radius:9px;left:50%;right:auto;transform:translateX(-50%);padding:0 8px;font-weight:600}
.slot.held{box-shadow:inset 0 0 0 3px var(--who,#fff),inset 0 14px 20px rgba(0,0,0,.7)}
.slot.mine{box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 26px rgba(232,182,90,.35),inset 0 14px 20px rgba(0,0,0,.7)}
.slot.remote-charge .lamp{animation:heat .5s ease-in-out infinite alternate}
@keyframes heat{to{filter:brightness(1.8) saturate(1.4)}}
.slot .owner.tear{background:#c12a1d;color:#fbe9d6;box-shadow:0 0 0 2px rgba(255,200,160,.5);animation:tear 1.2s ease-in-out infinite alternate}
@keyframes tear{to{box-shadow:0 0 0 2px rgba(255,200,160,.15)}}
.fingers{position:absolute;left:0;top:0;width:0;height:0;z-index:35;pointer-events:none}
.finger{position:absolute;left:0;top:0;opacity:0;transition:opacity .25s;will-change:transform}
.finger.down{opacity:1}
.finger i{position:absolute;left:-9px;top:-9px;width:18px;height:18px;border-radius:50%;background:var(--who);box-shadow:0 0 0 3px rgba(0,0,0,.35),0 0 14px var(--who)}
.finger b{position:absolute;left:12px;top:-22px;font:600 11px var(--sans);color:#1a0f0a;background:var(--who);padding:1px 6px;border-radius:7px;white-space:nowrap}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-8px);z-index:50;max-width:min(88vw,420px);padding:8px 14px;border-radius:12px;background:rgba(36,24,16,.94);border:1px solid #6b4428;color:var(--ink);font-size:13.5px;line-height:1.5;opacity:0;transition:opacity .25s,transform .25s;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}
dialog{background:#241810;color:var(--ink);border:1px solid #6b4428;border-radius:14px;padding:20px;width:min(86vw,340px);box-shadow:0 20px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(10,6,4,.6)}
dialog h2{margin:0 0 4px;font:700 20px var(--hand)}
dialog p{margin:0 0 14px;font-size:13px;color:var(--ink2)}
dialog input{box-sizing:border-box;width:100%;font:700 24px var(--hand);padding:14px 14px;border:0;border-radius:4px;background:linear-gradient(180deg,#fbe27a,#f2cd4b);color:#3a2914;outline:none;box-shadow:0 2px 0 #c99a22;-webkit-user-select:text;user-select:text}
dialog input::placeholder{color:rgba(58,41,20,.4)}
dialog .row{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
noscript{position:fixed;inset:0;display:grid;place-items:center;font-size:16px}
@media (prefers-reduced-motion:reduce){.float{animation:none;opacity:0}}
@media (max-width:420px){h1{font-size:23px}.hint{font-size:11.5px}button{padding:0 16px;font-size:15px}footer{gap:10px}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">
      <h1>碎碎平安</h1><span class="seal" aria-hidden="true">砸</span>
      <span class="hint" id="hint">点一下砸碎 · 按住蓄力 · 划一下甩飞</span>
    </div>
    <div class="count">已砸<b id="count">0</b></div>
  </header>
  <p class="roomline" id="roomline" aria-live="polite"></p>
  <main><div id="stage"><div class="shelf" id="shelf" role="group" aria-label="博古架，点一件东西把它砸碎"></div></div></main>
  <div class="waitbar" id="waitbar" aria-live="polite"></div>
  <footer>
    <button class="ghost" id="write" type="button">写烦心事</button>
    <button class="primary" id="all" type="button">全砸了</button>
    <button class="icon" id="mute" type="button" aria-label="关掉声音" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path class="wave" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="cross" d="M16 9.5l5 5M21 9.5l-5 5" hidden/></svg>
    </button>
  </footer>
</div>
<dialog id="dlg">
  <form method="dialog" id="noteForm">
    <h2>写下烦心事</h2>
    <p>最多十个字，贴上架子，然后砸了它。</p>
    <input id="noteText" name="t" maxlength="20" autocomplete="off" enterkeyhint="done" placeholder="比如：又要开会">
    <div class="row"><button class="ghost" value="cancel" type="button" id="noteCancel">算了</button><button class="primary" value="ok" type="submit">贴上去</button></div>
  </form>
</dialog>
<div class="toast" id="toast" role="status" hidden></div>
<noscript>这个小玩意需要打开 JavaScript 才能玩。</noscript>
<script src="src/core.js?v=4"></script>
<script type="module" src="src/game.js?v=6"></script>
</body>
</html>
