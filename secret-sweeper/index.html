<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#11161c">
<link rel="icon" href="data:,">
<title>凭证扫雷</title>
<meta name="description" content="经典扫雷换一层皮：格子是日志和配置，雷是藏着的钥匙，插旗就是打码。">
<style>
html,body{margin:0;height:100%;background:#11161c;overflow:hidden;overscroll-behavior:none;font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
[hidden]{display:none!important}
button{min-width:44px;min-height:44px;padding:0 4px;border:2px solid #3b4a5a;border-radius:10px;background:#1d2733;color:#f3ead8;font:700 16px inherit;font-family:inherit;touch-action:manipulation;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:translateY(1px)}
.bar{position:fixed;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 6px;box-sizing:border-box;white-space:nowrap}
#mode{font-size:15px}
#sound[aria-pressed="false"]{opacity:.65}
#mode[aria-pressed="true"]{background:#5a1f1f;border-color:#ff4d4d}
#title{position:fixed;left:50%;top:30%;transform:translateX(-50%);width:min(420px,calc(100vw - 32px));text-align:center;color:#f3ead8}
#title h1{margin:0 0 6px;font-size:30px;color:#ffb23e;letter-spacing:2px}
#title p{margin:0 0 14px;font-size:14px;line-height:1.5;color:#c9d1d9}
#levels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
#levels button{min-height:84px;padding:8px 4px;font-size:18px;color:#ffb23e}
#levels small{display:block;margin-top:6px;color:#c9d1d9;font-size:13px;font-weight:400}
#title .fine{margin-top:12px;font-size:12px;color:#8b98a5}
#card{position:fixed;left:50%;transform:translateX(-50%);width:min(380px,calc(100vw - 24px));box-sizing:border-box;padding:14px 16px;border-radius:14px;background:#0b0f14f2;border:2px solid #ff4d4d;color:#f3ead8;text-align:center}
#card.win{border-color:#7bd88f}
#card h2{margin:0 0 6px;font-size:22px}
#card .tale{margin:0 0 4px;font-size:14px;line-height:1.55;color:#c9d1d9;text-align:left}
#card .tale b{color:#ffb23e}
#card .never{margin:6px 0 10px;font-size:13px;color:#ff8a8a}
#card.win .never{color:#7bd88f}
#card .row{display:flex;gap:8px;justify-content:center}
#card .row button{flex:1}
#card #again{background:#2a3a2a;border-color:#7bd88f;font-size:18px}
#card #close{position:absolute;right:6px;top:6px;min-width:40px;min-height:40px;border:none;background:none;font-size:20px;color:#8b98a5}
#peek{position:fixed}
noscript{color:#f3ead8;position:fixed;inset:0;display:grid;place-items:center}
</style>
</head>
<body>
<canvas id="stage" aria-label="凭证扫雷棋盘：点格子翻开，长按插旗"></canvas>
<div id="title">
  <h1>凭证扫雷</h1>
  <p>就是扫雷。数字是周围藏着几把钥匙，<br>把钥匙全都插上旗🚩，别踩到。</p>
  <div id="levels">
    <button type="button" data-level="easy">轻松<small>7×9 · 9 把</small></button>
    <button type="button" data-level="normal">标准<small>8×11 · 15 把</small></button>
    <button type="button" data-level="hard">困难<small>9×13 · 24 把</small></button>
  </div>
  <p class="fine">点一下翻开 · 按住插旗 · 第一下不会踩雷<br>画面里的「钥匙」都是假的，而且故意写不全。</p>
</div>
<div class="bar" id="bar" hidden>
  <button type="button" id="mode" aria-pressed="false">👆 点：翻开</button>
  <button type="button" id="restart" aria-label="重来">↻ 重来</button>
  <button type="button" id="menu" aria-label="换难度">☰ 难度</button>
  <button type="button" id="sound" aria-label="声音：开" aria-pressed="true">🔊</button>
</div>
<div id="card" role="dialog" aria-live="polite" hidden>
  <button type="button" id="close" aria-label="收起，看盘面">✕</button>
  <h2 id="card-title"></h2>
  <div id="card-body"></div>
  <div class="row"><button type="button" id="again">↻ 再来一局</button><button type="button" id="levels-btn">换难度</button></div>
</div>
<button type="button" id="peek" hidden>看结果</button>
<noscript>这个小游戏需要打开 JavaScript 才能玩。</noscript>
<script src="src/core.js"></script>
<script src="src/game.js"></script>
</body>
</html>
