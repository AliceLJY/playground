<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!-- 手机外框（改自 2026-10-22 齿轮录屏的 phone-frame.html）：?mode=bg 出底图（背景+机身投影），?mode=overlay 出透明叠层（边框+状态栏+底部横条，网页区域镂空）。
     整机缩到 0.81425 倍并上移：网页区域落在 x 220–860、y 200–1503，页面底栏的按钮在 y 1480 以上，避开视频号、抖音、快手底部的遮挡区。 -->
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: transparent;
    font-family: -apple-system, 'SF Pro Text', 'PingFang SC', sans-serif; }
  .bg { position: absolute; inset: 0; background: radial-gradient(110% 75% at 50% 36%, #3b362d 0%, #1d1a16 55%, #0b0a08 100%); }
  #ph { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 172px; transform: translateY(28px) scale(0.81425); }
  .shadow { position: absolute; left: 122px; top: 83px; width: 836px; height: 1754px; border-radius: 135px; background: #101215;
    box-shadow: 0 60px 140px rgba(0,0,0,.7), 0 12px 40px rgba(0,0,0,.5); }
  .screen { position: absolute; left: 147px; top: 108px; width: 786px; height: 1704px; border-radius: 110px; overflow: hidden;
    box-shadow: 0 0 0 20px #0b0c0f, 0 0 0 23px #3d424b, 0 0 0 25px #1a1c21; }
  .status { position: absolute; left: 0; top: 0; width: 100%; height: 64px; background: #0e1116; color: #fff; }
  .time { position: absolute; left: 74px; top: 15px; font-size: 27px; font-weight: 600; letter-spacing: .3px; }
  .hole { position: absolute; left: 50%; top: 17px; width: 28px; height: 28px; margin-left: -14px; border-radius: 50%;
    background: #000; box-shadow: inset 0 0 0 4px #14171c; }
  .icons { position: absolute; right: 66px; top: 20px; display: flex; gap: 14px; align-items: center; }
  .nav { position: absolute; left: 0; bottom: 0; width: 100%; height: 40px; background: #0e1116; }
  .pill { position: absolute; left: 50%; bottom: 13px; width: 230px; height: 9px; margin-left: -115px; border-radius: 5px; background: rgba(255,255,255,.6); }
  .btn { position: absolute; width: 6px; border-radius: 3px; background: linear-gradient(90deg, #2c3038, #4a505a, #2c3038); }
  body.bg-mode .screen, body.bg-mode .btn { display: none; }
  body.ov-mode .bg, body.ov-mode .shadow { display: none; }
</style></head>
<body>
<div class="bg"></div>
<div id="ph">
<div class="shadow"></div>
<div class="btn" style="left:116px;top:430px;height:120px"></div>
<div class="btn" style="left:116px;top:575px;height:120px"></div>
<div class="btn" style="left:958px;top:520px;height:150px"></div>
<div class="screen">
  <div class="status">
    <div class="time">9:41</div>
    <div class="hole"></div>
    <div class="icons">
      <svg width="34" height="22" viewBox="0 0 34 22"><rect x="0" y="15" width="6" height="7" rx="1.5" fill="#fff"/><rect x="9" y="10" width="6" height="12" rx="1.5" fill="#fff"/><rect x="18" y="5" width="6" height="17" rx="1.5" fill="#fff"/><rect x="27" y="0" width="6" height="22" rx="1.5" fill="#fff"/></svg>
      <svg width="30" height="22" viewBox="0 0 30 22"><path d="M3 8.5a17 17 0 0 1 24 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M7.6 13a10.4 10.4 0 0 1 14.8 0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="15" cy="18.4" r="2.7" fill="#fff"/></svg>
      <svg width="48" height="22" viewBox="0 0 48 22"><rect x="1" y="1" width="40" height="20" rx="6" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="2"/><rect x="4" y="4" width="30" height="14" rx="3.5" fill="#fff"/><rect x="43.5" y="7.5" width="3" height="7" rx="1.5" fill="#fff" fill-opacity=".5"/></svg>
    </div>
  </div>
  <div class="nav"><div class="pill"></div></div>
</div>
</div>
<script>document.body.classList.add(new URLSearchParams(location.search).get('mode') === 'bg' ? 'bg-mode' : 'ov-mode');</script>
</body></html>
