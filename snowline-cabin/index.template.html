<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>雪线小木屋 · CABIN ABOVE THE SNOWLINE</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink: #eef2f8; --dim: rgba(226, 233, 245, .62); --glass: rgba(14, 20, 34, .42); --line: rgba(226, 233, 245, .16);
    --serif: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "STSong", Georgia, serif;
    --sans: "PingFang SC", "Helvetica Neue", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #070b16; color: var(--ink); overflow: hidden; font-family: var(--sans); }
  canvas#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: default; }
  .ui { position: fixed; inset: 0; pointer-events: none; padding: max(22px, env(safe-area-inset-top)) max(26px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(26px, env(safe-area-inset-left)); }
  .ui > * { position: absolute; }
  .brand { left: 28px; top: 24px; letter-spacing: .32em; font-size: 11px; }
  .brand b { display: block; font-weight: 600; }
  .brand span { display: block; margin-top: 7px; color: var(--dim); font-size: 9.5px; letter-spacing: .26em; }
  .badge { right: 28px; top: 22px; font-size: 10.5px; letter-spacing: .18em; padding: 7px 12px 7px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--glass); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .badge i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #ffc27a; margin-right: 8px; box-shadow: 0 0 8px #ffb060; vertical-align: 1px; }
  .copy { left: 28px; bottom: 96px; max-width: min(36vw, 460px); }
  .copy h1 { margin: 0; font-family: var(--serif); font-size: clamp(30px, 4.3vw, 62px); line-height: 1.14; letter-spacing: .02em; font-weight: 300; text-shadow: 0 2px 22px rgba(4, 8, 18, .7); }
  .copy h1 b { display: block; font-weight: 700; }
  .copy p { margin: 18px 0 0; max-width: 30em; font-size: 12.5px; line-height: 1.9; color: var(--dim); text-shadow: 0 1px 10px rgba(4, 8, 18, .8); }
  .tele { right: 28px; bottom: 26px; text-align: right; font-size: 10px; line-height: 1.8; letter-spacing: .12em; color: var(--dim); font-variant-numeric: tabular-nums; }
  .tele small { display: block; font-size: 9px; opacity: .7; letter-spacing: .08em; }
  .credit { right: 12px; top: 50%; writing-mode: vertical-rl; transform: translateY(-50%); font-size: 9px; letter-spacing: .42em; color: rgba(226, 233, 245, .4); }
  .tools { left: 28px; bottom: 24px; display: flex; gap: 8px; pointer-events: auto; }
  .tools button { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); color: var(--ink); cursor: pointer; display: grid; place-items: center; padding: 0; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); transition: background .2s, border-color .2s; }
  .tools button:hover { background: rgba(40, 52, 80, .6); }
  .tools button[aria-pressed="true"] { border-color: rgba(255, 194, 122, .7); color: #ffd9a8; }
  .tools svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .fail { inset: 0; display: none; place-items: center; text-align: center; padding: 40px; font-size: 14px; line-height: 1.9; color: var(--dim); }
  @media (max-aspect-ratio: 4/5) {
    .brand { left: 20px; top: 18px; right: 150px; line-height: 1.7; letter-spacing: .2em; } .brand span { display: none; } .badge { right: 20px; top: 16px; }
    .copy { left: 20px; right: 20px; bottom: 84px; max-width: none; }
    .copy h1 { font-size: clamp(30px, 9.4vw, 46px); }
    .copy p { margin-top: 12px; font-size: 12px; line-height: 1.75; }
    .tools { left: 20px; bottom: 20px; } .tele { right: 20px; bottom: 22px; font-size: 9px; }
    .tele .long, .credit { display: none; }
  }
  @media (max-height: 520px) { .copy p { display: none; } .copy { bottom: 78px; } .copy h1 { font-size: clamp(24px, 4.6vw, 40px); } }
</style>

<body>
<canvas id="scene" aria-label="雪夜山顶的小木屋，可以拖动旋转、滚轮缩放"></canvas>
<div class="ui">
  <div class="brand"><b>雪线小木屋 · CABIN ABOVE THE SNOWLINE</b><span>A WARM ROOM IN THE COLD · BUILT IN CODE</span></div>
  <div class="badge"><i></i>实时 PBR 场景</div>
  <div class="copy" id="copy">
    <h1>雪线之上，<b>有间小木屋。</b></h1>
    <p>沿着屋檐、木廊和山脊上的小屋慢慢转一圈。月光落在积雪上，炉火从有人的房间里亮起来。</p>
  </div>
  <div class="tele"><span class="long">虚构坐标 28.4° N · 99.1° E<br></span>月光 · 小雪 · 云海 3,400 m<small>场景为虚构设定，数字不对应真实地点</small></div>
  <div class="credit">STYLIZED WEB THREE.JS</div>
  <div class="tools" id="tools">
    <button type="button" data-act="in" aria-label="放大" title="放大"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5M8.5 11h5M11 8.5v5"/></svg></button>
    <button type="button" data-act="out" aria-label="缩小" title="缩小"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5M8.5 11h5"/></svg></button>
    <button type="button" data-act="reset" aria-label="复位" title="复位"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.2-5.1M5 4.5V8h3.5"/></svg></button>
    <button type="button" data-act="auto" aria-label="自动环绕" title="自动环绕" aria-pressed="true"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="4"/><circle cx="12" cy="12" r="2.2"/></svg></button>
  </div>
  <div class="fail" id="fail">这一页需要浏览器支持 WebGL。<br>换一个较新的浏览器，或者打开硬件加速再试。</div>
</div>
