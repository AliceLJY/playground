<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2a2440">
<title>骑楼擂台</title>
<link rel="icon" href="data:,">
<style>
:root{--red:#D7262E;--gold:#F2B230;--ink:#1d1a24;--paper:#F6EBD3;--sky:#3B3A6B}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#2a2440;color:var(--paper);font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(42,36,64,.55),rgba(20,16,30,.9));z-index:20;padding:16px}
.card{max-width:460px;width:100%;text-align:center}
.kicker{letter-spacing:.3em;color:var(--gold);font-size:13px}
h1{font-size:clamp(44px,12vw,72px);margin:.15em 0;letter-spacing:.12em;color:var(--paper);text-shadow:0 3px 0 var(--red),0 6px 18px rgba(0,0,0,.5)}
.sub{opacity:.85;line-height:1.7;font-size:15px}
button.big{margin-top:22px;background:var(--red);color:#fff;border:2px solid var(--gold);border-radius:999px;padding:12px 40px;font-size:18px;letter-spacing:.2em;cursor:pointer;box-shadow:0 4px 0 #7d1015}
button.big:active{transform:translateY(3px);box-shadow:0 1px 0 #7d1015}
.keys{margin-top:20px;font-size:12px;opacity:.75;line-height:1.9}
.keys b{display:inline-block;min-width:1.6em;padding:0 .4em;border:1px solid rgba(246,235,211,.5);border-radius:4px;margin:0 2px}
body.touch .keys{display:none}
#loading .bar{height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden;margin:18px auto 8px;width:220px}
#load-fill{height:100%;width:0;background:var(--gold);transition:width .2s}
#load-label{font-size:12px;opacity:.7}
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.phud{position:absolute;left:max(16px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));width:min(300px,52vw)}
.phud .name{font-weight:800;font-size:15px;margin-bottom:4px;text-shadow:0 1px 2px #000}
.bar2{height:12px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.35);border-radius:7px;overflow:hidden}
#p-fill{height:100%;background:linear-gradient(90deg,#e94848,#f59a5a);transition:width .15s}
#gong{margin-top:7px;display:flex;align-items:center;gap:6px;font-size:12px}
#gong .bar2{flex:1;height:8px}
#gong-fill{height:100%;background:var(--gold);transition:width .15s}
#gong .k{opacity:.6}
#gong.ready .k{opacity:1;color:var(--gold);animation:pulse .6s infinite alternate}
#gong.active #gong-fill{background:#ff6a2a}
@keyframes pulse{to{transform:scale(1.15)}}
#wave-name{position:absolute;right:max(16px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));font-size:13px;letter-spacing:.15em;opacity:.85;text-shadow:0 1px 2px #000}
#boss{position:absolute;left:50%;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 4px);transform:translateX(-50%);width:min(520px,70vw);opacity:0;transition:opacity .4s;text-align:center;font-size:13px;letter-spacing:.3em}
#boss.on{opacity:1}
#boss .bar2{margin-top:4px;height:10px}
#boss-fill{height:100%;background:linear-gradient(90deg,var(--red),var(--gold))}
body.touch #boss{bottom:auto;top:62px}
#combo{position:absolute;right:max(20px,env(safe-area-inset-right));top:40%;font-weight:900;font-size:44px;color:var(--gold);text-shadow:0 2px 0 var(--red);opacity:0;transform:scale(.8);transition:all .15s}
#combo.on{opacity:1;transform:scale(1)}
#combo small{font-size:14px;margin-left:4px;color:var(--paper)}
#banner{position:fixed;left:0;right:0;top:26%;text-align:center;font-size:clamp(26px,7vw,40px);font-weight:900;letter-spacing:.3em;color:var(--paper);text-shadow:0 3px 0 var(--red),0 0 18px rgba(0,0,0,.6);opacity:0;pointer-events:none;z-index:11}
#banner.on{animation:bannerIn 2.2s ease forwards}
@keyframes bannerIn{0%{opacity:0;transform:scale(1.3)}12%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
#dialog{position:fixed;left:50%;bottom:calc(max(24px,env(safe-area-inset-bottom)) + 120px);transform:translateX(-50%) translateY(20px);width:min(560px,calc(100vw - 32px));background:rgba(29,26,36,.88);border:2px solid var(--gold);border-radius:14px;padding:14px 18px 10px;font-size:17px;line-height:1.6;opacity:0;transition:all .2s;z-index:12;pointer-events:none}
#dialog.on{opacity:1;transform:translateX(-50%)}
#dialog b{display:block;color:var(--gold);font-size:14px;margin-bottom:2px}
#dialog small{display:block;text-align:right;opacity:.5;font-size:11px;margin-top:4px}
#hurt-flash{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 120px rgba(215,38,46,.9);opacity:0;z-index:9}
#hurt-flash.on{animation:hf .45s ease-out}
@keyframes hf{0%{opacity:1}100%{opacity:0}}
#popups .pop{position:fixed;transform:translate(-50%,-50%);font-weight:900;font-size:20px;color:#fff;text-shadow:0 2px 0 var(--red);animation:pop .7s ease-out forwards;pointer-events:none;z-index:9}
#popups .pop.big{font-size:30px;color:var(--gold)}
@keyframes pop{to{transform:translate(-50%,-140%);opacity:0}}
#topbtns{position:fixed;right:max(12px,env(safe-area-inset-right));top:calc(max(14px,env(safe-area-inset-top)) + 22px);display:flex;gap:6px;z-index:13}
#topbtns button{pointer-events:auto;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;width:36px;height:32px;font-size:15px}
#pad,#stick{display:none}
body.touch #pad{display:grid;position:fixed;right:max(14px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:10px;z-index:13}
#pad button{pointer-events:auto;border-radius:50%;border:2px solid rgba(246,235,211,.6);background:rgba(29,26,36,.55);color:var(--paper);font-size:20px;font-weight:800;font-family:inherit}
#pad button.down{background:var(--red)}
#pad button[data-act=punch]{grid-column:3;grid-row:2;width:74px;height:74px;margin:-5px;background:rgba(215,38,46,.7)}
#pad button[data-act=kick]{grid-column:2;grid-row:2}
#pad button[data-act=roll]{grid-column:3;grid-row:1}
#pad button[data-act=block]{grid-column:1;grid-row:2}
#pad button[data-act=gong]{grid-column:2;grid-row:1;font-size:16px}
body.touch #stick{display:block;position:fixed;left:40px;bottom:60px;width:120px;height:120px;border-radius:50%;border:2px solid rgba(246,235,211,.35);background:rgba(0,0,0,.2);opacity:.45;pointer-events:none;z-index:13}
body.touch #stick.on{opacity:1}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:rgba(246,235,211,.7)}
#paused{z-index:30}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="loading" class="screen"><div class="card"><div class="kicker">西关 · 醒狮擂台</div><h1>骑楼擂台</h1><div class="bar"><div id="load-fill"></div></div><div id="load-label">载入中</div></div></div>

<div id="title" class="screen hidden">
  <div class="card">
    <div class="kicker">西关 · 黄昏 · 醒狮擂台</div>
    <h1>骑楼擂台</h1>
    <div class="sub">街坊在骑楼街尽头摆了一台醒狮擂台。<br>你是粤剧武生阿龙，从街口一路打上去。</div>
    <button id="start" class="big">开 锣</button>
    <div class="keys"><b>W</b><b>A</b><b>S</b><b>D</b> 移动 · <b>J</b>/左键 拳 · <b>K</b>/右键 脚 · <b>空格</b> 翻滚<br><b>Q</b> 按住格挡 · <b>E</b> 锣鼓满了开二阶段 · 拖动鼠标转镜头 · <b>M</b> 声音</div>
  </div>
</div>

<div id="hud" class="hidden">
  <div class="phud">
    <div class="name">阿龙</div>
    <div class="bar2"><div id="p-fill"></div></div>
    <div id="gong"><span>锣鼓</span><div class="bar2"><div id="gong-fill"></div></div><span class="k">E</span></div>
  </div>
  <div id="wave-name"></div>
  <div id="boss">醒狮头<div class="bar2"><div id="boss-fill"></div></div></div>
  <div id="combo"><span id="combo-n">0</span><small>连击</small></div>
  <div id="popups"></div>
</div>
<div id="topbtns"><button id="mute" type="button">🔊</button><button id="pause-btn" type="button">❙❙</button></div>
<div id="banner"></div>
<div id="dialog"></div>
<div id="hurt-flash"></div>
<div id="stick"><div id="knob"></div></div>
<div id="pad"><button data-act="punch">拳</button><button data-act="kick">脚</button><button data-act="roll">滚</button><button data-act="block">挡</button><button data-act="gong">锣</button></div>

<div id="end" class="screen hidden"><div class="card"><h1 id="end-title" style="font-size:clamp(26px,7vw,44px);letter-spacing:.06em;white-space:nowrap"></h1><div id="end-sub" class="sub"></div><button id="again" class="big">再来</button></div></div>
<div id="paused" class="screen hidden"><div class="card"><h1 style="font-size:40px">歇一歇</h1><div class="sub">按 Esc 或右上角继续</div></div></div>

<script type="module" src="./main.js"></script>
</body>
</html>
