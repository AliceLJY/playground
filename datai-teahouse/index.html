<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>搭台 · 茶楼早市</title>
<meta name="description" content="广州茶楼早市，和陌生人搭一张桌：一盅两件，各看各的报纸，没有聊天框。能做的只有落座、斟茶、叩指、揭盖、翻报纸、夹一件、离席。桌满了自动开下一桌；别人是你自己前几次来的回放，没人时坐着两个标注过的灰色身影。">
<style>
  :root { --wood: #6b4a2b; --paper: #efe6d2; --ink: #2a2118; --muted: rgba(42,33,24,.6); --accent: #c7532f; --bar: #f6efe0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #3a2817; color: var(--ink); overflow: hidden; overscroll-behavior: none; }
  body { font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif; -webkit-tap-highlight-color: transparent; display: flex; flex-direction: column; height: 100dvh; }
  .top { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: calc(8px + env(safe-area-inset-top)) 14px 8px; background: var(--bar); border-bottom: 1px solid rgba(0,0,0,.12); white-space: nowrap; }
  .top .where { font-size: 15px; letter-spacing: .08em; }
  .top .where b { font-weight: 700; }
  .top .hall { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
  #scene { flex: 1 1 auto; display: block; width: 100%; min-height: 0; touch-action: none; }
  .bottom { flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); background: var(--bar); border-top: 1px solid rgba(0,0,0,.12); }
  .bottom button { font: inherit; font-size: 15px; letter-spacing: .12em; min-height: 46px; padding: 6px 4px; color: var(--ink); background: #fffaf0; border: 1px solid rgba(42,33,24,.45); border-radius: 4px; cursor: pointer; }
  .bottom button:disabled { color: rgba(42,33,24,.32); border-color: rgba(42,33,24,.16); background: transparent; cursor: default; }
  .bottom button.hot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 2px rgba(199,83,47,.18) inset; }
  .bottom button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bottom button.sub { font-size: 13px; color: var(--muted); letter-spacing: .06em; }
  .hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(122px + env(safe-area-inset-bottom)); font-size: 12.5px; letter-spacing: .1em; color: #f3e6c8; background: rgba(42,33,24,.72); padding: 6px 14px; border-radius: 3px; pointer-events: none; opacity: 0; transition: opacity .3s; white-space: nowrap; max-width: calc(100vw - 24px); overflow: hidden; text-overflow: ellipsis; }
  .hint.show { opacity: 1; }
  @media (min-width: 700px) {
    .top .where { font-size: 17px; } .top .hall { font-size: 14px; }
    .bottom { grid-template-columns: repeat(8, 1fr); max-width: 980px; width: 100%; margin: 0 auto; }
    .hint { bottom: calc(84px + env(safe-area-inset-bottom)); }
  }
  @media (max-height: 420px) { .hint { bottom: auto; top: calc(44px + env(safe-area-inset-top)); } }
</style>
</head>
<body>
<div class="top">
  <div class="where" id="where"><b>搭台</b> · 入门</div>
  <div class="hall" id="hall">大堂 0 桌 · 0 人</div>
</div>
<canvas id="scene" aria-label="茶楼大堂与你这一桌"></canvas>
<div class="hint" id="hint"></div>
<div class="bottom" id="bar">
  <button type="button" data-act="0">落座</button>
  <button type="button" data-act="1">斟茶</button>
  <button type="button" data-act="2">叩指</button>
  <button type="button" data-act="3">揭盖</button>
  <button type="button" data-act="4">翻报纸</button>
  <button type="button" data-act="5">夹一件</button>
  <button type="button" data-act="6">离席</button>
  <button type="button" class="sub" id="mute" aria-pressed="false">静音</button>
</div>
<script src="src/core.js"></script>
<script src="src/game.js"></script>
</body>
</html>
